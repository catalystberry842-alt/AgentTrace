# Keeps the hosted apps' serverless instances and their Blob chain cache warm, so a judge's first
# page load does not pay for a cold start plus a chain catch-up. Read-only GET requests.
name: keep-warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Warm both networks
        run: |
          for base in https://agenttrace-mainnet.vercel.app https://agenttrace-plum.vercel.app; do
            for path in / /agents /proofs /api/proofs /api/agents/1 /api/firewalls/1; do
              code=$(curl -s -o /dev/null -w '%{http_code} %{time_total}s' --max-time 60 "$base$path" || true)
              echo "$base$path $code"
            done
          done
